name: Chest Cancer Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint Code
        run: echo "Linting repository"

      - name: Run Unit Tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Build & Push Docker Images to ECR
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push All Service Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          SERVICES=("auth" "upload" "train" "predict")

          for SERVICE in "${SERVICES[@]}"; do
            echo "🚀 Building image for $SERVICE..."
            docker build \
              -t $ECR_REGISTRY/${SERVICE}:$IMAGE_TAG \
              -f ml_microservices/${SERVICE}/Dockerfile \
              .
            docker push $ECR_REGISTRY/${SERVICE}:$IMAGE_TAG
          done

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Connect to EC2 & Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # exit if any command fails

            echo "🧰 Installing dependencies..."
            sudo apt-get update -y
            sudo apt-get install -y awscli git docker-compose-plugin

            PROJECT_DIR="/home/ubuntu/End-to-End-Chest-Cancer-Classification-using-MLfLow"

            echo "📦 Preparing project directory..."
            if [ -d "$PROJECT_DIR" ]; then
              echo "✅ Directory exists. Pulling latest code..."
              cd $PROJECT_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              echo "🚚 Cloning repository..."
              git clone https://github.com/Rishabh1234-hash/End-to-End-Chest-Cancer-Classification-using-MLfLow.git $PROJECT_DIR
              cd $PROJECT_DIR
            fi

            echo "🔑 Logging into AWS ECR..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_LOGIN_URI }}

            echo "📥 Pulling latest Docker images..."
            SERVICES=("auth" "upload" "train" "predict")
            for SERVICE in "${SERVICES[@]}"; do
              sudo docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${SERVICE}:latest
            done

            echo "🧹 Cleaning old containers..."
            sudo docker compose down || true
            sudo docker system prune -af

            echo "🚀 Starting services..."
            sudo docker compose up -d

            echo "✅ Deployment complete!"