name: Chest Cancer Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint Code
        run: echo "Linting repository"

      - name: Run Unit Tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Build & Push Docker Images to ECR
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["interface", "auth", "upload", "train", "predict"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          echo "🚀 Building image for $SERVICE_NAME..."
          
          # Set the Dockerfile path. 'interface' uses the root Dockerfile.
          DOCKERFILE_PATH="./Dockerfile"
          if [ "$SERVICE_NAME" != "interface" ]; then
            DOCKERFILE_PATH="./ml_microservices/${SERVICE_NAME}/Dockerfile"
          fi
          
          echo "Using Dockerfile at: $DOCKERFILE_PATH"

          docker build \
            -t $ECR_REGISTRY/${SERVICE_NAME}:$IMAGE_TAG \
            -f $DOCKERFILE_PATH \
            .
          
          echo "🚀 Pushing image for $SERVICE_NAME..."
          docker push $ECR_REGISTRY/${SERVICE_NAME}:$IMAGE_TAG

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Connect to EC2 & Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "🧰 Installing dependencies (git, curl, unzip)..."
            sudo apt-get update -y
            sudo apt-get install -y git curl unzip

            echo "🔧 Installing/Updating AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -o awscliv2.zip
            sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
            rm -rf awscliv2.zip aws

            PROJECT_DIR="/home/ubuntu/End-to-End-Chest-Cancer-Classification-using-MLfLow"

            echo "📦 Checking project directory..."
            if [ -d "$PROJECT_DIR" ]; then
              echo "✅ Project directory exists. Updating..."
              cd $PROJECT_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              echo "🚚 Cloning repository..."
              git clone https://github.com/Rishabh1234-hash/End-to-End-Chest-Cancer-Classification-using-MLfLow.git $PROJECT_DIR
              cd $PROJECT_DIR
            fi

            echo "🔑 Logging into AWS ECR..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_LOGIN_URI }}

            # Grab the secret for later use
            ECR_URI=${{ secrets.AWS_ECR_LOGIN_URI }}

            echo "🧹 Cleaning old containers and images FIRST to save space..."
            ECR_LOGIN_URI=$ECR_URI sudo docker compose down --remove-orphans || true
            sudo docker system prune -af

            # *** NEW COMMAND TO CLEAR APT CACHE ***
            echo "🧹 Clearing system apt cache..."
            sudo apt-get clean -y
            # *** END OF NEW COMMAND ***

            echo "📥 Pulling latest Docker images..."
            SERVICES=("interface" "auth" "upload" "train" "predict")
            for SERVICE in "${SERVICES[@]}"; do
              sudo docker pull $ECR_URI/${SERVICE}:latest
            done

            echo "🚀 Starting all containers..."
            ECR_LOGIN_URI=$ECR_URI sudo docker compose up -d

            echo "✅ Deployment complete!"
