name: Chest Cancer Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint Code
        run: echo "Linting repository"

      - name: Run Unit Tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Build & Push Docker Images to ECR
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["interface", "auth", "upload", "train", "predict"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image for ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          echo "🚀 Building image for $SERVICE_NAME..."
          
          # Set the Dockerfile path. 'interface' uses the root Dockerfile.
          DOCKERFILE_PATH="./Dockerfile"
          if [ "$SERVICE_NAME" != "interface" ]; then
            DOCKERFILE_PATH="./ml_microservices/${SERVICE_NAME}/Dockerfile"
          fi

          docker build \
            -t $ECR_REGISTRY/${SERVICE_NAME}:$IMAGE_TAG \
            -f $DOCKERFILE_PATH \
            .

          echo "✅ Build complete. Pushing $SERVICE_NAME to ECR..."
          docker push $ECR_REGISTRY/${SERVICE_NAME}:$IMAGE_TAG

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Connect to EC2 & Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Install dependencies on the EC2 host
            echo "Updating apt and installing dependencies..."
            sudo apt-get update -y
            sudo apt-get install -y git unzip curl
            
            # 2. Install awscli v2
            echo "Installing AWS CLI v2..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
            rm -f awscliv2.zip
            rm -rf aws
            echo "AWS CLI successfully installed."
            
            # 3. Clone or update the repository
            export REPO_URL="https://github.com/Rishabh1234-hash/End-to-End-Chest-Cancer-Classification-using-MLfLow.git"
            export REPO_DIR="End-to-End-Chest-Cancer-Classification-using-MLfLow"
            
            if [ -d "$REPO_DIR" ]; then
              echo "Repository already exists. Pulling latest changes..."
              cd $REPO_DIR
              git pull origin main
            else
              echo "Cloning repository..."
              git clone $REPO_URL
              cd $REPO_DIR
            fi
            
            # 4. Log in to Amazon ECR
            echo "🔁 Logging in to ECR and pulling latest images..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_LOGIN_URI }}
            
            SERVICES=("interface" "auth" "upload" "train" "predict")
            for SERVICE in "${SERVICES[@]}"; do
              docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${SERVICE}:latest
            done
            
            # 5. Stop and restart all containers
            echo "🧹 Cleaning old containers..."
            docker compose down || true
            docker system prune -af
            
            echo "🚀 Starting all containers..."
            docker compose up -d
