version: '3.9'

# ======================================
# 1. Shared Network — allows containers to communicate
# ======================================
networks:
  cnn-network:
    driver: bridge

# ======================================
# 2. Named Volumes — shared data across containers
# ======================================
volumes:
  uploads-data:  # For sharing uploaded images
    driver: local
  model-data:    # For sharing the trained model
    driver: local

# ======================================
# 3. Service Definitions
# ======================================
services:
  # ----------------------------
  # Interface Service (Frontend / app.py)
  # ----------------------------
  interface-service:
    image: ${ECR_LOGIN_URI}/interface:latest
    container_name: interface_service
    ports:
      - "8080:8080"
    networks:
      - cnn-network
    restart: always
    depends_on:
      - auth-service
      - upload-service
      - predict-service
      - train-service

  # ----------------------------
  # Authentication Service
  # ----------------------------
  auth-service:
    image: ${ECR_LOGIN_URI}/auth:latest
    container_name: auth_service
    ports:
      - "3001:3001"
    networks:
      - cnn-network
    restart: always

  # ----------------------------
  # Upload Service
  # ----------------------------
  upload-service:
    image: ${ECR_LOGIN_URI}/upload:latest
    container_name: upload_service
    ports:
      - "3002:3002"
    volumes:
      - uploads-data:/app/uploads   # Shares uploaded images
    networks:
      - cnn-network
    depends_on:
      - auth-service
    restart: always

  # ----------------------------
  # Prediction Service
  # ----------------------------
  predict-service:
    image: ${ECR_LOGIN_URI}/predict:latest
    container_name: predict_service
    ports:
      - "3003:3003"
    volumes:
      - uploads-data:/app/uploads   # Reads uploaded images
      - model-data:/app/model       # Reads trained model
    networks:
      - cnn-network
    depends_on:
      - upload-service
    restart: always

  # ----------------------------
  # Training Service
  # ----------------------------
  train-service:
    image: ${ECR_LOGIN_URI}/train:latest
    container_name: train_service
    ports:
      - "3004:3004"
    volumes:
      - uploads-data:/app/data/train  # Reads uploads for training
      - model-data:/app/model         # Saves trained model
    networks:
      - cnn-network
    depends_on:
      - predict-service
    restart: always
